# GPU cluster placed INSIDE the workspace VNet's AML subnet, so its nodes resolve
# the (public-access-disabled) workspace storage to its private endpoint and can
# read code / write outputs. The earlier cluster was in the default network and
# could not reach storage at all. Public IP is on for outbound (no NAT on subnet).
# For AmlCompute the subnet is NOT a YAML field - pass it on the CLI:
#     az ml compute create --name gpu-t4 --type AmlCompute --size Standard_NC8as_T4_v3 `
#       --min-instances 0 --max-instances 2 --idle-time-before-scale-down 300 --tier dedicated `
#       --subnet /subscriptions/<subscription-id>/resourceGroups/<resource-group>/providers/Microsoft.Network/virtualNetworks/<vnet-name>/subnets/snet-aml `
#       -g <resource-group> -w <workspace>
$schema: https://azuremlschemas.azureedge.net/latest/amlCompute.schema.json
name: gpu-t4
type: amlcompute
size: Standard_NC8as_T4_v3
min_instances: 0
max_instances: 2
idle_time_before_scale_down: 300
tier: dedicated
