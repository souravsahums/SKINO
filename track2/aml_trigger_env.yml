# Conda environment for the SKINO AML *trigger* only.
# This env is used on the small CPU compute instance to SUBMIT jobs to the GPU
# cluster and to FETCH their results. It does NOT run any training - the cluster
# jobs use their own curated PyTorch environment - so it needs the Azure ML SDK,
# an auth library, and numpy + matplotlib to draw the review figures after fetch.
#
# Create and use it on the compute-instance terminal:
#     conda env create -f track2/aml_trigger_env.yml
#     conda activate skino-trigger
#     python -m track2.aml_trigger
# Already have it?  Add the plotting packages with:
#     conda env update -n skino-trigger -f track2/aml_trigger_env.yml
name: skino-trigger
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy
  - matplotlib
  - pip:
      - azure-ai-ml>=1.34,<2
      - azure-identity>=1.15
